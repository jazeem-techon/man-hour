<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="8" y1="0" x2="56" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#60A5FA"/>
      <stop offset="0.45" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#1E40AF"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="tile"><rect width="64" height="64" rx="16"/></clipPath>
  </defs>

  <!-- tile -->
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>
  <g clip-path="url(#tile)">
    <ellipse cx="32" cy="-6" rx="46" ry="30" fill="url(#gloss)"/>
  </g>

  <!-- track ring -->
  <circle cx="32" cy="32" r="19" fill="none" stroke="#fff" stroke-opacity="0.28" stroke-width="5"/>
  <!-- progress arc (logged hours) -->
  <circle cx="32" cy="32" r="19" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"
          stroke-dasharray="86 120" transform="rotate(-90 32 32)"/>
  <!-- clock hands -->
  <path d="M32 21.5V32l6.5 4" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="32" cy="32" r="2.4" fill="#fff"/>
</svg>
